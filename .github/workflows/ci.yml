name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Validate POSIX installer
        if: runner.os == 'Linux'
        run: sh -n scripts/install.sh
      - run: python scripts/build_zipapp.py
      - run: python dist/spaceflow.pyz --version
